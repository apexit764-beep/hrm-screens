/* ---------- Brand maths: tints, shades and a readable band ---------- */
function hexToRgb(h) { const m = h.replace('#','').match(/.{2}/g).map(x => parseInt(x, 16)); return { r:m[0], g:m[1], b:m[2] }; }
function shade(hex, amount) {
  const c = hexToRgb(hex);
  const f = v => Math.max(0, Math.min(255, Math.round(v * (1 - amount))));
  return '#' + [f(c.r), f(c.g), f(c.b)].map(v => v.toString(16).padStart(2, '0')).join('');
}
function relLum(hex) {
  const c = hexToRgb(hex);
  const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(c.r) + 0.7152 * f(c.g) + 0.0722 * f(c.b);
}
function readableOn(hex) {
  const L = relLum(hex);
  return (L + 0.05) / 0.0585 > 1.05 / (L + 0.05) ? '#121217' : '#fff';
}
/* أقلّ حجاب أسود يجعل النصّ الأبيض يبلغ 4.5:1 فوق لون العميل.
   حجاب ثابت لا يكفي: الأزرق الغامق يمرّ بـ12% والسماوي يحتاج 42%. */
function scrimFor(hex, highlight) {
  const c = hexToRgb(hex);
  const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  const lumAt = a => {
    const px = ['r','g','b'].map(k => c[k] * (1 - a) * (1 - highlight) + 255 * highlight);
    return 0.2126 * f(px[0]) + 0.7152 * f(px[1]) + 0.0722 * f(px[2]);
  };
  const TARGET = 1.05 / 4.5 - 0.05;
  let lo = 0, hi = 0.75;
  for (let i = 0; i < 24; i++) { const mid = (lo + hi) / 2; if (lumAt(mid) > TARGET) lo = mid; else hi = mid; }
  return Math.min(0.75, Math.max(0.12, hi));
}

let TENANT = TENANTS[0];

function applyTenant(t) {
  TENANT = t;
  const c = hexToRgb(t.color);
  const r = document.documentElement.style;
  const isLight = relLum(t.color) > 0.45;
  const a = isLight ? 0.03 : scrimFor(t.color, 0.12);

  r.setProperty('--brand', t.color);
  r.setProperty('--brand-deep', shade(t.color, isLight ? 0.12 : 0.42));
  r.setProperty('--brand-fg', readableOn(t.color));
  r.setProperty('--scrim-a', a.toFixed(3));
  r.setProperty('--scrim-b', Math.min(0.80, a + 0.26).toFixed(3));
  r.setProperty('--brand-soft', 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',0.10)');
  r.setProperty('--brand-line', 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',0.28)');

  const markHtml = t.logo ? '<img src="' + t.logo + '" alt="' + t.name + '">' : '<span class="hero-mark">' + t.mark + '</span>';
  document.getElementById('heroLogo').innerHTML = markHtml;
  document.getElementById('brandLogo').innerHTML = t.logo ? '<img src="' + t.logo + '" alt="">' : t.mark;

  const band = document.getElementById('heroBand');
  band.style.backgroundImage = t.cover || '';
  band.classList.toggle('light', isLight && !t.cover);

  document.getElementById('brandName').textContent = t.name;
  document.getElementById('heroOrgName').textContent = t.name;
  document.getElementById('heroOrgDomain').textContent = t.domain;
  document.getElementById('footRights').textContent = t.rights;
  document.getElementById('powered').hidden = t.poweredHidden;
  document.title = 'الوظائف المتاحة — ' + t.short;

  document.querySelectorAll('.demo-btn').forEach(b => b.classList.toggle('on', b.dataset.k === t.key));
  render();
}

function buildDemo() {
  document.getElementById('demoBtns').innerHTML = TENANTS.map(t =>
    '<button class="demo-btn" data-k="' + t.key + '" onclick="applyTenant(TENANTS.find(x=>x.key===\'' + t.key + '\'))">' +
    '<span class="demo-swatch" style="background:' + t.color + '"></span>' + t.short + '</button>'
  ).join(' ');
}

/* خيارات الفلاتر تُبنى من الوظائف نفسها — لا قائمة ثابتة تتقادم عند تغيّر البيانات */
function buildFilters() {
  const fill = (id, values) => {
    const s = document.getElementById(id);
    [...new Set(values)].sort((a, b) => a.localeCompare(b, 'ar')).forEach(v => s.add(new Option(v, v)));
  };
  fill('fDept', JOBS.map(j => j.dept));
  fill('fBranch', JOBS.map(j => j.branch));
  fill('fType', JOBS.map(j => j.type));
}

const ICO = {
  branch: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  type: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>',
  onsite: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14"/><path d="M9 21v-5h6v5"/></svg>',
  remote: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/></svg>',
  time: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  hybrid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v18M16 3v18M3 8h18M3 16h18"/></svg>',
  go:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>'
};
/* أيقونة لكل نمط عمل — الخريطة أوضح من شرط ثنائي يُسقط «هجين» على أيقونة الحضوري */
const MODE_ICO = { 'حضوري': ICO.onsite, 'عن بُعد': ICO.remote, 'هجين': ICO.hybrid };

/* تمييز العدد في العربية: مفرد ومثنى وجمع قلّة (٣–١٠) وتمييز مفرد منصوب (١١+) */
function daysAr(n) {
  if (n === 1) return 'أمس';
  if (n === 2) return 'يومين';
  if (n <= 10) return n + ' أيام';
  return n + ' يوماً';
}

function jobCard(j) {
  const flags =
    (j.days <= 3 ? '<span class="tag-new">جديدة</span>' : '') +
    (j.deadline <= 5 ? '<span class="tag-soon">تنتهي خلال ' + daysAr(j.deadline) + '</span>' : '');
  return '' +
  '<div class="job">' +
    '<div class="job-main">' +
      '<div class="job-head"><span class="job-title">' + j.title + '</span>' + flags + '</div>' +
      '<div class="job-dept">' + j.dept + '</div>' +
      '<div class="job-meta">' +
        '<span class="pill brand">' + ICO.type + j.type + '</span>' +
        // الفرع التابعة له الوظيفة — لا مكان العمل. لذا «فرع الرياض · عن بُعد» ليست تكراراً
        '<span class="pill">' + ICO.branch + 'فرع ' + j.branch + '</span>' +
        '<span class="pill">' + (MODE_ICO[j.mode] || ICO.onsite) + j.mode + '</span>' +
        '<span class="pill">' + ICO.time + (j.days === 1 ? 'نُشرت أمس' : 'نُشرت قبل ' + daysAr(j.days)) + '</span>' +
      '</div>' +
    '</div>' +
    // التذييل أسفل الكرت دائماً — job-main يتمدّد فتستوي أطراف الكروت في الشبكة
    '<div class="job-side">' +
      '<span class="job-apps">' + j.apps + ' متقدّم حتى الآن</span>' +
      '<a class="btn btn-apply" href="job-apply.html">' + ICO.go + 'عرض الوظيفة</a>' +
    '</div>' +
  '</div>';
}

function render() {
  const q      = document.getElementById('q').value.trim();
  const dept   = document.getElementById('fDept').value;
  const branch = document.getElementById('fBranch').value;
  const type   = document.getElementById('fType').value;

  const hits = JOBS.filter(j =>
    (!q      || (j.title + ' ' + j.dept).includes(q)) &&
    (!dept   || j.dept   === dept)   &&
    (!branch || j.branch === branch) &&
    (!type   || j.type   === type)
  );

  document.getElementById('list').innerHTML = hits.map(jobCard).join('');
  document.getElementById('empty').hidden = hits.length > 0;

  const filtered = !!(q || dept || branch || type);
  document.getElementById('resCount').innerHTML = filtered
    ? '<b>' + hits.length + '</b> من ' + JOBS.length + ' وظيفة'
    : '<b>' + JOBS.length + '</b> وظيفة متاحة';
  document.getElementById('clearBtn').hidden = !filtered;

  // الترويسة والهيرو يعرضان الإجمالي دائماً — لا يتبعان الفلترة
  const branches = new Set(JOBS.map(j => j.branch)).size;
  document.getElementById('heroSub').textContent =
    JOBS.length + ' وظيفة مفتوحة في ' + branches + ' فروع · فريق ' + TENANT.short;
  document.getElementById('headCount').textContent = JOBS.length + ' وظيفة متاحة';
}

function clearAll() {
  document.getElementById('q').value = '';
  ['fDept','fBranch','fType'].forEach(id => document.getElementById(id).value = '');
  render();
}

/* الهيدر يظهر فقط بعد خروج الهيرو من أعلى الشاشة — قبلها هو تكرار له.
   القياس من موضع الهيرو لا من IntersectionObserver: الأخير يصمت حين
   يكون ارتفاع النافذة صفراً (إطارات مضمّنة، معاينات). */
function watchHeader() {
  const head = document.querySelector('.site-head');
  const hero = document.querySelector('.hero-card');
  if (!head || !hero) return;
  const update = () => head.classList.toggle('show', hero.getBoundingClientRect().bottom < 60);
  /* خنق زمني لا requestAnimationFrame: الأخير يتوقّف في التبويبات الخلفية */
  let last = 0, timer = null;
  const onScroll = () => {
    const now = Date.now();
    if (now - last >= 16) { last = now; update(); return; }
    clearTimeout(timer);
    timer = setTimeout(() => { last = Date.now(); update(); }, 16);
  };
  addEventListener('scroll', onScroll, { passive: true });
  addEventListener('resize', onScroll, { passive: true });
  update();
}

buildDemo();
buildFilters();
applyTenant(TENANTS[0]);
watchHeader();
</script>
